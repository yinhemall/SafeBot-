<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Guardian{% endblock %}</title>

    <meta
        name="description"
        content="Guardian is a modern Discord security and moderation dashboard."
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<nav class="navbar">
    <div class="navbar-inner">

        <a href="{{ url_for('index') }}" class="brand">
            <span class="brand-mark">G</span>
            <span>Guardian</span>
        </a>

        <div class="nav-links">

            <a href="{{ url_for('index') }}">Home</a>

            {% if session.get("user") %}
                <a href="{{ url_for('dashboard') }}">Dashboard</a>

                <a href="{{ url_for('logout') }}" class="nav-logout">
                    Logout
                </a>
            {% else %}
                <a href="{{ url_for('login') }}" class="btn btn-small">
                    Login with Discord
                </a>
            {% endif %}

        </div>

    </div>
</nav>


<main>
    {% block content %}
    {% endblock %}
</main>


<footer class="site-footer">
    <div class="container footer-inner">

        <div>
            <strong>Guardian</strong>
            <span>Discord Security</span>
        </div>

        <div>
            Guardian • Security first
        </div>

    </div>
</footer>

</body>
</html>
